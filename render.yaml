# Render Blueprint: deploys the backend API and the website together.
# On render.com: New → Blueprint → pick this repo. See README "Deploying on Render".
services:
  # Python backend (server/main.py)
  - type: web
    name: doodhdrishti-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r server/requirements.txt
    startCommand: python server/main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DD_JWT_SECRET
        generateValue: true          # Render creates a random secret once and keeps it
      # Only the website may call the API. Public address of doodhdrishti-web.
      # (Render's fromService "host" gives the internal name, which browsers can't use.)
      - key: DD_ALLOWED_ORIGINS
        value: https://doodhdrishti-web.onrender.com

  # React website (static build of src/)
  - type: web
    name: doodhdrishti-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite                # let /dashboard, /login, ... load the app on refresh
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_USE_MOCK           # "false" = use the backend above; "true" = demo data in the browser
        value: "false"
      # Public address of doodhdrishti-api. Built into the site, so changing it needs a redeploy.
      - key: VITE_API_URL
        value: https://doodhdrishti-api.onrender.com
